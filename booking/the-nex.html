<title>Sales Booking · The Nex</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft Yahei", Verdana, Arial, Helvetica, sans-serif;
    font-size: 13px; color: #222; background: #fff;
    display: flex; flex-direction: column;
  }

  /* top bar */
  .topbar {
    height: 50px; flex: none; background: #1f232b; color: #fff;
    display: flex; align-items: center; padding: 0 20px; gap: 18px;
  }
  .topbar .brand { height: 46px; width: auto; display: block; }
  .topbar .sep { width: 1px; height: 18px; background: #555; }
  .topbar .title { font-size: 16px; color: #d8dbe2; white-space: nowrap; }
  .topbar .updated { margin-left: auto; font-size: 12px; color: #9aa0ab; white-space: nowrap; }

  /* filter row */
  .filters {
    flex: none; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 18px 20px 14px;
  }
  .filters label { font-size: 13px; }
  .select, .input {
    height: 30px; border: 1px solid #d9d9d9; border-radius: 2px; background: #fff;
    font: inherit; font-size: 14px; padding: 0 10px; color: #222;
  }
  .select { min-width: 240px; max-width: 100%; }
  .input { width: 165px; }
  .input::placeholder { color: #aaa; }
  .btn {
    height: 30px; padding: 0 20px; border: 0; border-radius: 2px;
    background: #3a6cf4; color: #fff; font: inherit; font-size: 14px; cursor: pointer;
  }
  .btn:hover { background: #2f5de0; }

  /* group / block tabs row */
  .tabsbar {
    flex: none; margin: 0 20px; background: #e8eef7;
    display: flex; align-items: center; gap: 30px; padding: 0 20px; height: 40px;
  }
  .tabsbar .group {
    height: 28px; min-width: 126px; border: 1px solid #d9d9d9; background: #fff;
    display: flex; align-items: center; padding: 0 10px; color: #333; font-size: 13px;
  }
  .tabsbar .tab {
    height: 40px; display: flex; align-items: center; padding: 0 2px;
    font-size: 13px; border-bottom: 2px solid #4fb47f; color: #222;
  }
  .tabsbar .summary { margin-left: auto; font-size: 13px; color: #3a6cf4; white-space: nowrap; }

  /* grid */
  .board { flex: 1; min-height: 0; overflow: auto; margin: 0 20px; padding: 40px 20px 12px; }
  .wrap-unit { display: inline-block; }
  .roof {
    height: 25px; margin-left: 204px; background: #7cc98f;
    clip-path: polygon(25px 0, 100% 0, 100% 100%, 0 100%);
  }
  table.floor { border-collapse: separate; border-spacing: 0; border-top: 1px solid #4fb47f; border-left: 1px solid #4fb47f; }
  table.floor td { border-right: 1px solid #4fb47f; border-bottom: 1px solid #4fb47f; }
  thead td { height: 27px; text-align: center; background: #fff; font-size: 13px; }
  td.idx { width: 80px; min-width: 80px; text-align: center; background: #fff; }
  td.more { width: 112px; min-width: 112px; padding: 2px 0 2px 6px; color: #333; font-size: 12px; white-space: nowrap; }
  td.more p { margin: 0; line-height: 22px; }
  td.cell { width: 120px; min-width: 120px; padding: 2px; }
  .room {
    width: 116px; height: 134px; border: 1px solid #e7e7eb; font-size: 12px;
    background: #ddf8ff; color: #222; cursor: default; transition: transform .08s;
  }
  .room.sold { background: #f5545a; color: #fff; }
  .room p { margin: 0; line-height: 22px; height: 22px; text-align: right; padding: 0 4px; white-space: nowrap; overflow: hidden; }
  .room p.num { font-size: 20px; text-align: center; }
  .room:not(.sold) { cursor: pointer; }
  .room.picked { border: 2px solid #7ed321; }
  .room.hit { outline: 3px solid #3a6cf4; outline-offset: -1px; }
  .room.dim { opacity: .25; }

  /* legend */
  .legend {
    flex: none; display: flex; gap: 30px; padding: 12px 40px 16px; list-style: none; margin: 0;
  }
  .legend li { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend b { width: 16px; height: 16px; display: inline-block; border: 1px solid #999; }

  .preview-bar { flex: none; background: #ffe58f; color: #7a5200; text-align: center; font-size: 14px; padding: 6px 16px; }

  /* unit detail side panel */
  .mask { position: fixed; inset: 50px 0 0 0; background: transparent; display: none; z-index: 9; }
  .mask.open { display: block; }
  .panel {
    position: fixed; top: 50px; right: 0; bottom: 0; width: 410px; max-width: 100%;
    background: #fff; box-shadow: -4px 0 16px rgba(0,0,0,.12); z-index: 10;
    padding: 20px 30px; overflow-y: auto;
    transform: translateX(100%); transition: transform .2s ease;
  }
  .panel.open { transform: none; }
  .p-close {
    position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border: 0; background: #fff;
    font-size: 22px; line-height: 22px; color: #999; cursor: pointer; padding: 0;
  }
  .p-close:hover { color: #333; }
  .p-head { display: flex; gap: 8px; font-size: 13px; line-height: 32px; color: #222; margin: 0 0 6px -12px; padding-right: 10px; }
  .p-icon { flex: none; width: 26px; height: 26px; margin-top: 3px; border-radius: 50%; background: #4a7cf6; display: flex; align-items: center; justify-content: center; }
  .p-row { display: flex; font-size: 13px; line-height: 18px; padding: 12px 0; }
  .p-row span:first-child { width: 108px; flex: none; color: #666; }
  .p-row span:last-child { color: #222; }

  @media (max-width: 640px) {
    .topbar { padding: 0 16px; gap: 10px; }
    .topbar .updated { display: none; }
    .filters { padding: 14px 16px 10px; }
    .select { min-width: 0; flex: 1; }
    .tabsbar { margin: 0 16px; padding: 0 12px; gap: 14px; }
    .tabsbar .group { display: none; }
    .board { margin: 0 16px; padding: 30px 0 10px; }
    .legend { padding: 10px 16px 14px; }
  }
</style>
</head>

// Booking collected but not yet updated in the developer system (2026-11-11).
// Remove each unit once the system shows it sold.
const BOOKED = new Set(["L08-13A", "L08-23A", "L08-30", "L08-31"]);

const floors = FLOORS.map(s => {
  const [floor, list] = s.split("|");
  const units = list.split(",").map(u => {
    if (!u) return null;
    const [no, layout, sqft, price, sold] = u.split("~");
    return { no, layout, sqft: Number(sqft), price: Number(price), sold: sold === "1" || BOOKED.has(no) };
  });
  return { floor, units };
});
const cols = Math.max(...floors.map(f => f.units.length));
const units = new Map(floors.flatMap(f => f.units.filter(Boolean).map(u => [u.no, u])));
const rm = n => "RM " + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

let total = 0, avail = 0;
let html = '<div class="wrap-unit"><div class="roof"></div><table class="floor"><thead><tr><td class="idx">Floor</td><td class="more"></td>';
for (let c = 1; c <= cols; c++) html += `<td class="cell">${String(c).padStart(2, "0")}</td>`;
html += "</tr></thead><tbody>";
for (const f of floors) {
  html += `<tr><td class="idx">${f.floor}</td><td class="more"><p>Unit No.</p><p>Unit Layout</p><p>Unit Type</p><p>List Price</p><p>Build Up Area</p><p>Bumi</p></td>`;
  for (let c = 0; c < cols; c++) {
    const u = f.units[c];
    if (!u) { html += '<td class="cell"></td>'; continue; }
    total++; if (!u.sold) avail++;
    html += `<td class="cell"><div class="room${u.sold ? " sold" : ""}" data-no="${u.no}" title="${u.no} · ${u.sold ? "Sold" : "Available"}">` +
      `<p class="num">${u.no}</p><p>${u.layout}</p><p></p><p>${rm(u.price)}</p><p>${u.sqft.toLocaleString("en-US")} sqft</p><p>Non_Bumi</p></div></td>`;
  }
  html += "</tr>";
}
html += "</tbody></table></div>";
document.getElementById("board").innerHTML = html;
document.getElementById("summary").textContent = `Available ${avail} / ${total} units`;
document.getElementById("updated").textContent = `Updated ${UPDATED}`;

const q = document.getElementById("q");
function search() {
  const term = q.value.trim().toUpperCase();
  let first = null;
  document.querySelectorAll(".room").forEach(el => {
    const hit = term && el.dataset.no.toUpperCase().includes(term);
    el.classList.toggle("hit", !!hit);
    el.classList.toggle("dim", !!term && !hit);
    if (hit && !first) first = el;
  });
  if (first) first.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
}
document.getElementById("go").addEventListener("click", search);
q.addEventListener("keydown", e => { if (e.key === "Enter") search(); });
q.addEventListener("input", () => { if (!q.value.trim()) search(); });

// Unit detail side panel, available units only
const panel = document.getElementById("panel");
const mask = document.getElementById("mask");
let picked = null;
function openPanel(el) {
  const u = units.get(el.dataset.no);
  document.getElementById("p-title").textContent = `THE NEX-STRATIFIED INDUSTRIAL PARCEL-STRATIFIED INDUSTRIAL PARCEL-${u.no}`;
  const rows = [
    ["Sales Status", "Available"], ["Room Type", ""], ["Car Park", ""],
    ["Unit Layout", u.layout],
    ["Build Up Area", u.sqft.toLocaleString("en-US", { minimumFractionDigits: 2 })],
    ["Land Area", "0.00"], ["List Price", rm(u.price)], ["Bumi", "No"]
  ];
  document.getElementById("p-rows").innerHTML = rows.map(([k, v]) => `<div class="p-row"><span>${k}</span><span>${v}</span></div>`).join("");
  if (picked) picked.classList.remove("picked");
  picked = el; el.classList.add("picked");
  panel.classList.add("open"); mask.classList.add("open");
}
function closePanel() {
  panel.classList.remove("open"); mask.classList.remove("open");
  if (picked) { picked.classList.remove("picked"); picked = null; }
}
// Preview mode (?preview in the URL): click a unit to flip Available/Sold on this screen only.
// Nothing is saved; a refresh brings back the real data.
const PREVIEW = new URLSearchParams(location.search).has("preview");
if (PREVIEW) {
  const bar = document.createElement("div");
  bar.className = "preview-bar";
  bar.textContent = "PREVIEW — not real data. Click a unit to switch Available / Sold. Changes are not saved.";
  document.body.prepend(bar);
  document.title = "PREVIEW · " + document.title;
}
function updateSummary() {
  const all = document.querySelectorAll(".room");
  const free = [...all].filter(el => !el.classList.contains("sold")).length;
  document.getElementById("summary").textContent = `Available ${free} / ${all.length} units`;
}

document.getElementById("board").addEventListener("click", e => {
  const el = e.target.closest(".room");
  if (!el) return;
  if (PREVIEW) {
    el.classList.toggle("sold");
    el.title = `${el.dataset.no} · ${el.classList.contains("sold") ? "Sold" : "Available"}`;
    updateSummary();
    return;
  }
  if (!el.classList.contains("sold")) openPanel(el);
});
document.getElementById("p-close").addEventListener("click", closePanel);
mask.addEventListener("click", closePanel);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
</script>
